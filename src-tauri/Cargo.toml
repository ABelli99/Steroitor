[package]
name = "steroitor"
version = "1.0.0"
description = "Notepad potenziato con integrazione Git"
edition = "2021"

[lib]
name = "steroitor_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
notify-debouncer-mini = "0.7.0"
ignore = "0.4.33"
trash = "5.2.9"
portable-pty = "0.9.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
